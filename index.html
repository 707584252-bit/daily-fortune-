<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日一签</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f7f4ed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 360px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .card.hide {
      opacity: 0;
      transform: translateY(12px);
    }

    .card.shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .fortune {
      font-size: 22px;
      color: #333;
      margin-bottom: 16px;
    }

    .thanks {
      font-size: 16px;
      color: #777;
      line-height: 1.6;
    }

    button {
      margin-top: 24px;
      padding: 10px 28px;
      border: none;
      border-radius: 8px;
      background: #4a7c59;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    button:hover { background: #3d6649; }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="card">
    <div class="fortune" id="fortune">点击下方按钮，抽今日一签</div>
    <div class="thanks" id="thanks"></div>
    <button onclick="draw()">抽一签</button>
  </div>

  <script>
   const fortunes = [
  { luck: "今日宜静", thanks: "愿你心里那片喧嚣，今天自己会安静下来。" },
  { luck: "今日宜息", thanks: "身体替你扛了很久，今天请让它放下人生碌碌。" },
  { luck: "今日宜勇", thanks: "你开口的那一刻，世界就已经让开了半步。" },
  { luck: "今日宜柔", thanks: "对别人温柔不难，难的是也留一点给自己。" },
  { luck: "今日宜持", thanks: "难走的路，往往就是向上走的那条。" },
  { luck: "今日宜放", thanks: "松开手，风才进得来。" },
  { luck: "今日宜始", thanks: "第一步小一点没关系，世界不也随着风向在一点一点染上绿色吗?" },
  { luck: "今日宜读", thanks: "给大脑留一点安静，它会还你一整片晴朗。" },
  { luck: "今日宜眠", thanks: "早一点关灯，明天才有力气亮起来。" },
  { luck: "今日宜笑", thanks: "你还能对生活温柔，这件事本身就很了不起。" },
  { luck: "今日宜自信", thanks: "你属于你自己，你在任何地方都能绽放。" },
  { luck: "今日宜旅行", thanks: "生活、旅行、冒险，别感到遗憾。" },
   
];
    function typeText(el, text, delay = 30) {
      el.textContent = "";
      [...text].forEach((ch, i) => {
        setTimeout(() => { el.textContent += ch; }, i * delay);
      });
    }

    function draw() {
      const card = document.querySelector(".card");

      card.classList.add("shake");
      setTimeout(() => card.classList.remove("shake"), 400);

      card.classList.add("hide");

      setTimeout(() => {
        const idx = Math.floor(Math.random() * fortunes.length);
        typeText(document.getElementById("fortune"), fortunes[idx].luck);
        typeText(document.getElementById("thanks"), fortunes[idx].thanks);
        card.classList.remove("hide");
      }, 400);
    }
  </script>
</body>
</html>
